<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fortune Poker — $1/$3 and $3/$5/$10 NLH</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --line: #2a2e38;
      --text: #e7e9ee;
      --muted: #9aa3b2;
      --blue: #8eb7ff;
      --green: #b6e37a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 8px 12px 6px;
      gap: 6px;
    }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; }
    h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }
    .now { margin: 0; font-variant-numeric: tabular-nums; }
    .checked, .empty { color: var(--muted); }
    .checked { margin: 0; font-size: 0.75rem; }
    .key { display: inline-flex; gap: 10px; color: var(--muted); font-size: 0.75rem; }
    .key i { display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: middle; }
    a { color: var(--blue); }
    #error { color: #ffb4b4; margin: 0; }
    .views { flex: 1; min-height: 0; display: grid; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px; }
    section { min-height: 0; display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
    h2 { margin: 0; font-size: 0.78rem; font-weight: 600; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-height: 0; height: 100%; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 6px 2px;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    h3 { margin: 0; font-size: 0.72rem; font-weight: 600; color: #c5cad3; }
    .chart { position: relative; flex: 1; min-height: 0; height: 100%; }
    .empty { margin: 4px 0; font-size: 0.75rem; }
    @media (max-width: 640px) {
      html, body, main { height: auto; }
      .views { display: block; }
      section { display: block; margin-top: 14px; }
      .pair { grid-template-columns: 1fr; }
      .chart { height: 180px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Fortune Poker</h1>
      <p class="now" id="line-13">Loading…</p>
      <p class="now" id="line-3510"></p>
      <p class="key"><span><i style="background:#8eb7ff"></i>tables</span><span><i style="background:#b6e37a"></i>waitlist</span></p>
      <p class="checked"><time id="checked">…</time> PT · <span id="started"></span> · <a href="https://fortunepokerroom.com/" target="_blank" rel="noopener noreferrer">fortunepokerroom.com</a></p>
    </header>
    <p id="error" role="alert" hidden></p>
    <div class="views">
      <section>
        <h2>Step and area</h2>
        <div class="pair" id="pair-step"></div>
      </section>
      <section>
        <h2>Per open table</h2>
        <div class="pair" id="pair-ratio"></div>
      </section>
      <section>
        <h2>By hour</h2>
        <div class="pair" id="pair-hour"></div>
      </section>
    </div>
  </main>
  <script>
    const HISTORY_DAYS = 30;
    const RELOAD_MS = 10 * 60 * 1000;
    const BLUE = "#8eb7ff";
    const GREEN = "#b6e37a";
    const TICK = "#8b93a1";
    const GRID = "rgba(255,255,255,0.06)";
    const FILL = "rgba(182, 227, 122, 0.16)";
    const GAMES = [
      { id: "13", stake: "$1/$3", active: "active_tables_1_3", wait: "waitlist_players_1_3", line: "line-13" },
      { id: "3510", stake: "$3/$5/$10", active: "active_tables", wait: "waitlist_players", line: "line-3510" }
    ];
    const VIEWS = ["step", "ratio", "hour"];

    const checked = document.getElementById("checked");
    const started = document.getElementById("started");
    const errorEl = document.getElementById("error");
    const charts = {};

    GAMES.forEach((game) => {
      VIEWS.forEach((view) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = "<h3>" + game.stake + "</h3>"
          + "<div class='chart' id='wrap-" + view + "-" + game.id + "'><canvas id='" + view + "-" + game.id + "'></canvas></div>"
          + "<p class='empty' id='empty-" + view + "-" + game.id + "' hidden></p>";
        document.getElementById("pair-" + view).appendChild(card);
      });
    });

    const pointLabels = {
      id: "pointLabels",
      afterDatasetsDraw(chart) {
        const labels = chart.data.datasets[0] && chart.data.datasets[0].pointLabels;
        if (!labels) return;
        const meta = chart.getDatasetMeta(0);
        const ctx = chart.ctx;
        ctx.save();
        ctx.fillStyle = "#c5cad3";
        ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
        ctx.textAlign = "center";
        meta.data.forEach((pt, i) => {
          if (labels[i] == null || pt.skip) return;
          ctx.fillText(labels[i] + " tbl", pt.x, pt.y - 8);
        });
        ctx.restore();
      }
    };

    function countPhrase(n, singular, plural) {
      return n + " " + (n === 1 ? singular : plural);
    }

    function setError(message) {
      errorEl.hidden = !message;
      errorEl.textContent = message || "";
    }

    function num(row, key) {
      return typeof row[key] === "number" ? row[key] : null;
    }

    function rowsFor(rows, game) {
      return rows.filter((row) => num(row, game.active) !== null);
    }

    function median(values) {
      const sorted = values.slice().sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function hourBuckets(rows, game) {
      const buckets = new Map();
      rowsFor(rows, game).forEach((row) => {
        const date = new Date(row.ts);
        const hour = Number(new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Los_Angeles", hour: "numeric", hourCycle: "h23"
        }).format(date));
        const label = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Los_Angeles", hour: "numeric"
        }).format(date);
        if (!buckets.has(hour)) buckets.set(hour, { label, tables: [], waiting: [] });
        const bucket = buckets.get(hour);
        bucket.tables.push(row[game.active]);
        if (num(row, game.wait) !== null) bucket.waiting.push(row[game.wait]);
      });
      return [...buckets.entries()].sort((a, b) => a[0] - b[0]).map((entry) => entry[1]);
    }

    function axis(title, color, max, right) {
      return {
        beginAtZero: true,
        position: right ? "right" : "left",
        suggestedMax: (max || 0) + 1,
        title: title ? { display: true, text: title, color: color || TICK, font: { size: 10 } } : undefined,
        ticks: { precision: 0, color: TICK, font: { size: 10 } },
        grid: right ? { drawOnChartArea: false } : { color: GRID }
      };
    }

    function baseOptions(scales) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: { legend: { display: false } },
        scales
      };
    }

    function lineSet(label, data, color, width, extra) {
      return Object.assign({
        label,
        data,
        borderColor: color,
        backgroundColor: color,
        borderWidth: width,
        pointRadius: data.length > 48 ? 0 : 3,
        pointHoverRadius: 4,
        tension: 0,
        spanGaps: false
      }, extra || {});
    }

    function mount(id, config) {
      const canvas = document.getElementById(id);
      const wrap = document.getElementById("wrap-" + id);
      const empty = document.getElementById("empty-" + id);
      if (charts[id]) {
        charts[id].destroy();
        charts[id] = null;
      }
      if (!config) {
        wrap.hidden = true;
        empty.hidden = false;
        empty.textContent = "No samples yet.";
        return;
      }
      empty.hidden = true;
      wrap.hidden = false;
      charts[id] = new Chart(canvas, config);
    }

    function drawStep(game, rows) {
      const mine = rowsFor(rows, game);
      const id = "step-" + game.id;
      if (!mine.length) return mount(id, null);
      const tables = mine.map((row) => row[game.active]);
      const waiting = mine.map((row) => num(row, game.wait));
      const peak = Math.max(0, ...tables, ...waiting.filter((v) => v !== null));
      mount(id, {
        type: "line",
        data: {
          labels: mine.map((row) => row.ts_label),
          datasets: [
            lineSet("Active tables", tables, BLUE, 3, { stepped: true }),
            lineSet("Waitlist", waiting, GREEN, 2, { backgroundColor: FILL, fill: true, stepped: true })
          ]
        },
        options: baseOptions({
          x: { ticks: { maxTicksLimit: 4, maxRotation: 0, color: TICK, font: { size: 10 } }, grid: { display: false } },
          y: axis("", TICK, peak)
        })
      });
    }

    function drawRatio(game, rows) {
      const mine = rowsFor(rows, game).filter((row) => row[game.active] > 0 && num(row, game.wait) !== null);
      const id = "ratio-" + game.id;
      if (!mine.length) return mount(id, null);
      const ratios = mine.map((row) => Math.round((row[game.wait] / row[game.active]) * 10) / 10);
      mount(id, {
        type: "line",
        plugins: [pointLabels],
        data: {
          labels: mine.map((row) => row.ts_label),
          datasets: [
            lineSet("Players per table", ratios, BLUE, 3, {
              pointLabels: mine.map((row, i) => (i === 0 || mine[i - 1][game.active] !== row[game.active] ? row[game.active] : null))
            })
          ]
        },
        options: baseOptions({
          x: { ticks: { maxTicksLimit: 4, maxRotation: 0, color: TICK, font: { size: 10 } }, grid: { display: false } },
          y: Object.assign(axis("", TICK, Math.max(...ratios)), { ticks: { color: TICK, precision: 1 } })
        })
      });
    }

    function drawHour(game, rows) {
      const buckets = hourBuckets(rows, game);
      const id = "hour-" + game.id;
      if (!buckets.length) return mount(id, null);
      const tables = buckets.map((bucket) => median(bucket.tables));
      const waiting = buckets.map((bucket) => bucket.waiting.length ? median(bucket.waiting) : null);
      const peak = Math.max(0, ...tables, ...waiting.filter((v) => v !== null));
      mount(id, {
        type: "bar",
        data: {
          labels: buckets.map((bucket) => bucket.label),
          datasets: [
            { label: "Median tables", data: tables, backgroundColor: BLUE },
            { label: "Median waitlist", data: waiting, backgroundColor: GREEN }
          ]
        },
        options: baseOptions({
          x: { ticks: { color: TICK, font: { size: 10 } }, grid: { display: false } },
          y: axis("", TICK, peak)
        })
      });
    }

    function drawGame(game, rows) {
      drawStep(game, rows);
      drawRatio(game, rows);
      drawHour(game, rows);
    }

    function render(rows) {
      const cutoff = Date.now() - HISTORY_DAYS * 24 * 60 * 60 * 1000;
      rows = (Array.isArray(rows) ? rows : [])
        .filter((row) => row && Date.parse(row.ts) >= cutoff && (num(row, "active_tables") !== null || num(row, "active_tables_1_3") !== null))
        .slice()
        .sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));

      const last = rows[rows.length - 1];
      if (!last) {
        checked.textContent = "—";
        checked.removeAttribute("datetime");
        started.textContent = "History starts after the first sample.";
        GAMES.forEach((game) => {
          document.getElementById(game.line).textContent = "No " + game.stake + " samples yet";
          drawGame(game, []);
        });
        return;
      }

      checked.textContent = last.ts_label;
      checked.setAttribute("datetime", last.ts);
      started.textContent = countPhrase(rows.length, "sample", "samples");
      GAMES.forEach((game) => {
        const tables = num(last, game.active);
        const waiting = num(last, game.wait);
        const line = document.getElementById(game.line);
        if (tables === null) {
          line.textContent = "No " + game.stake + " samples yet";
        } else {
          line.textContent = game.stake + " " + countPhrase(tables, "table", "tables") + " · " + waiting + " waiting";
        }
        drawGame(game, rows);
      });
    }

    async function load() {
      try {
        const res = await fetch("data/history.json?t=" + Date.now());
        if (!res.ok) throw new Error("Could not load history (" + res.status + ")");
        render(await res.json());
        setError("");
      } catch (err) {
        setError(err && err.message ? err.message : "Could not load history");
      }
    }

    load();
    setInterval(load, RELOAD_MS);
  </script>
</body>
</html>
